# The concordance manifest — the only figures this repository produces.
#
# `dev/concordance.py --check` compares the notebook's rendered output set
# against the `stem`s below: anything extra is a figure nobody asked for,
# anything missing is unfinished work, and both are silent failures without
# something that looks. Panels are listed so a reviewer can see what is
# claimed, and which panels of a figure are drawn here rather than elsewhere.
#
# Numbering follows the manuscript PDF (allfigs_hiconcms_penultimate_102126.pdf):
# Figures 1-8 and S1-S4, with the paper's own panel letters. A panel the paper has
# that this repo does not draw is listed as `skipped`.
#
# status: done | restyle | new | gap | skipped
#   done     - exists and matches the reference
#   restyle  - exists; needs house style / renumbering only
#   new      - analysis or panel does not exist yet
#   gap      - existed once, source lost, must be rebuilt from a reference image
#   skipped  - deliberately not drawn here (that panel comes from elsewhere)

main:
- id: fig2
  stem: fig2_response_matrix
  title: Odorant x glomerulus responses at the three concentrations
  supersedes: []
